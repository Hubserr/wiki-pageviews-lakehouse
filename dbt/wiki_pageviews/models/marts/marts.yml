version: 2

models:
  - name: dim_project
    columns:
      - name: project_key
        data_tests:
          - unique
          - not_null
      - name: domain_code
        data_tests:
          - unique
          - not_null
      - name: platform
        data_tests:
          - accepted_values:
              arguments:
                values: ['desktop', 'mobile']
  - name: dim_date
    columns:
     - name: date_key
       data_tests:
        - unique
        - not_null
  - name: dim_hour
    columns:
     - name: hour_key
       data_tests:
       - unique
       - not_null
     - name: part_of_day_utc
       data_tests:
        - accepted_values:
            arguments:
              values: ['night', 'morning', 'afternoon', 'evening']
  - name: dim_page
    columns:
    - name: page_key
      data_tests:
      - unique
      - not_null
